<ion-card>
  <ion-card-header>
    <ion-card-title>Círculo</ion-card-title>
    <ion-card-subtitle>Perímetro</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <p>
      El perímetro de un círculo es la longitud de la línea que forma su borde.
      Fórmula: <strong>P = 2 · π · r</strong>
    </p>

    <img src="assets/img/circulo.png"
         alt="Diagrama del círculo"
         loading="lazy"
         style="max-width: 220px; margin: 16px auto; display: block;" />

    <ion-item>
      <div style="width: 100%; padding: 8px 0;">
        <label style="display: block; font-size: 12px; color: var(--ion-color-medium); margin-bottom: 4px;">Radio (cm)</label>
        <input type="number"
               name="radio"
               placeholder="Ingrese el radio"
               [(ngModel)]="radio"
               style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; background: transparent; color: inherit;" />
      </div>
    </ion-item>

    <ion-button expand="block" class="ion-margin-top" (click)="calcularPerimetro()">
      CALCULAR EL PERÍMETRO
    </ion-button>

    <ion-text color="primary" *ngIf="resultado">
      <p class="ion-margin-top"><strong>{{ resultado }}</strong></p>
    </ion-text>
  </ion-card-content>
</ion-card>

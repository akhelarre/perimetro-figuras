<!-- src/app/home/home.page.html -->
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Cálculo de Perímetros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-item>
    <ion-select label="Figura Geométrica"
                placeholder="Seleccione una figura"
                (ionChange)="manejarSeleccionFigura($event)">
      <ion-select-option value="circulo">Círculo</ion-select-option>
      <ion-select-option value="triangulo">Triángulo</ion-select-option>
    </ion-select>
  </ion-item>

  <app-circulo *ngIf="esCirculo()"></app-circulo>
  <app-triangulo *ngIf="esTriangulo()"></app-triangulo>
</ion-content>
